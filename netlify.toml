# Next.js App Router on Netlify — use the official runtime plugin.
# Do NOT add SPA fallback redirects (/* → /index.html); they break server-rendered routes
# like /pocketbuddy/*.

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Install devDependencies during `npm ci` / `npm install` even when NODE_ENV=production
  # (Netlify production sets NODE_ENV=production, which otherwise skips @types/react, etc.).
  NPM_CONFIG_PRODUCTION = "false"

[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "development"

[context.branch-deploy.environment]
  NODE_ENV = "development"
